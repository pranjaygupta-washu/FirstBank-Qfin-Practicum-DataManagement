# SOURCE REGISTRY
# Every observation in a release table traces back to a source_id listed here.

sources:
  - source_id: french_ff5_mom
    name: Kenneth R. French Data Library, monthly factors
    url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html
    covers: [mkt_rf, smb, hml, rmw, cma, mom, rf]
    native_units: percent
    conversion: divide by 100 to reach decimal
    missing_sentinel: -99.99
    cadence: monthly, published with a lag
    access: public download, no key
    known_issue: date column is integer YYYYMM; file contains an annual block appended
                 after the monthly block that must be cut before parsing.

  - source_id: french_developed
    name: French Data Library, developed and emerging regional factors
    url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html
    covers: [mkt_rf, smb, hml, mom]
    native_units: percent
    conversion: divide by 100
    cadence: monthly
    access: public download
    known_issue: regional factor history is shorter than US history. Required for
                 FIGFX, VTMGX, DODFX, DFEMX. US factors are the wrong model for these funds.

  - source_id: fred
    name: FRED, Federal Reserve Bank of St. Louis
    url: https://fred.stlouisfed.org
    covers: [DGS10, DGS2, T10Y2Y, CPIAUCSL]
    native_units: percent_per_annum
    conversion: divide by 100 for decimal yields
    cadence: daily to monthly
    access: public, API key optional
    note: yield levels are rate context only. They are NOT bond total return series.
          Project 5 use, not a substitute for DODIX or BNDX returns.

  - source_id: fund_returns_primary
    name: Monthly fund total returns
    candidates:
      - wrds_crsp_mutual_fund      # PREFERRED if WashU entitlement covers it
      - morningstar_direct
      - issuer_nav_plus_distributions
    native_units: varies by source, must be recorded per load
    cadence: monthly
    access: TO CONFIRM with WashU library and with First Bank
    note: published 1/3/5 year summary returns are NOT usable. Project 2 needs the
          monthly series. Reconstructing from NAV plus distributions is possible but
          is the single largest time risk in the data workstream.

  - source_id: jpm_ltcma
    name: J.P. Morgan Long-Term Capital Market Assumptions
    url: https://am.jpmorgan.com/us/en/asset-management/adv/insights/portfolio-insights/ltcma/
    covers: [arithmetic_er, compound_er, volatility, correlation_matrix]
    native_units: percent_per_annum
    conversion: divide by 100
    cadence: annual vintage
    access: public PDF, NO API
    note: extraction is manual into a versioned CSV, then checked by a second person.
          Vintage year is part of the release identity.

  - source_id: benchmark_proxies
    name: ETF total return histories used as benchmark proxies
    covers: [IVV, IWF, IWD, IWO, IWN, EFA, EFG, EFV, EEM, AGG, IGSB, STIP]
    native_units: varies
    cadence: monthly
    access: issuer pages or same source as fund returns
    note: these are PROXIES, labelled as such in every output. First Bank's official
          benchmark for each fund supersedes them if provided.
